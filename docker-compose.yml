version: "3.9"

services:

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: resume_api

    ports:
      - "8000:8080"

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/resume_db

    depends_on:
      - db

    volumes:
      - ./backend:/app

  db:
    image: pgvector/pgvector:pg16

    container_name: resume_db

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resume_db

    ports:
      - "5433:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
