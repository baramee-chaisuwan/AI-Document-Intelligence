name: CI/CD Backend

on:
  push:
    branches:
      - main
      - feature/**

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: pgvector/pgvector:pg16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d resume_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resume_db
      PGVECTOR_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resume_db
      GEMINI_API_KEY: ci-test-only-not-a-real-key
      JWT_SECRET_KEY: ci-test-only-jwt-secret-with-at-least-32-bytes
      TESTING: "true"
      PYTHON_DOTENV_DISABLED: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Wait for PostgreSQL
        run: |
          for i in {1..10}; do
            if pg_isready -h localhost -p 5432 -U postgres -d resume_db; then
              exit 0
            fi

            echo "Waiting for PostgreSQL..."
            sleep 2
          done

          echo "PostgreSQL did not become ready"
          exit 1

      - name: Run Alembic Migrations
        working-directory: backend
        run: |
          python -m alembic upgrade head

      - name: Run Tests
        working-directory: backend
        run: |
          python -m pytest -q


  deploy:
    name: Deploy Backend to Cloud Run
    needs: test
    runs-on: ubuntu-24.04

    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
      IMAGE_NAME: ats-api
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set Up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry Authentication
        run: |
          gcloud auth configure-docker \
            "${REGION}-docker.pkg.dev" \
            --quiet

      - name: Build Backend Image
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${IMAGE_TAG}"

          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

          docker build \
            --platform linux/amd64 \
            --tag "${IMAGE_URI}" \
            backend

      - name: Push Backend Image
        run: |
          docker push "${IMAGE_URI}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE_URI}" \
            --quiet

      - name: Resolve Cloud Run URL
        run: |
          SERVICE_URL="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(status.url)')"

          echo "SERVICE_URL=${SERVICE_URL}" >> "$GITHUB_ENV"

          echo "Cloud Run service: ${SERVICE_URL}"

      - name: Verify Health Endpoint
        run: |
          for attempt in {1..12}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              "${SERVICE_URL}/health/"; then
              echo
              echo "Production health check passed."
              exit 0
            fi

            echo "Waiting for revision... attempt ${attempt}/12"
            sleep 10
          done

          echo "Production health check failed."
          exit 1