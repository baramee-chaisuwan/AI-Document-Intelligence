name: CI/CD Backend

on:
  push:
    branches:
      - main
      - feature/**

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy backend to Cloud Run"
        required: false
        default: true
        type: boolean


permissions:
  contents: read
  id-token: write


jobs:

  test:

    name: Backend Tests

    runs-on: ubuntu-24.04

    timeout-minutes: 15


    services:

      postgres:

        image: pgvector/pgvector:pg16

        env:

          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_db


        ports:

          - 5432:5432


        options: >-
          --health-cmd="pg_isready -U postgres -d resume_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10



    env:

      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resume_db

      PGVECTOR_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resume_db

      GEMINI_API_KEY: ci-test-only-not-real

      JWT_SECRET_KEY: ci-test-only-jwt-secret-with-at-least-32-bytes

      TESTING: "true"

      PYTHON_DOTENV_DISABLED: "1"

      PYTHONUNBUFFERED: "1"



    steps:


      - name: Checkout Repository
        uses: actions/checkout@v4



      - name: Setup Python
        uses: actions/setup-python@v5
        with:

          python-version: "3.13"

          cache: pip

          cache-dependency-path: backend/requirements.txt



      - name: Install Dependencies
        working-directory: backend
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt



      - name: Wait PostgreSQL
        run: |

          for i in {1..20}; do

            pg_isready \
              -h localhost \
              -p 5432 \
              -U postgres \
              -d resume_db && exit 0


            echo "Waiting PostgreSQL..."

            sleep 2

          done


          exit 1



      - name: Run Database Migration
        working-directory: backend
        run: |

          python -m alembic upgrade head



      - name: Run Tests
        working-directory: backend
        run: |

          pytest -q





  deploy:


    name: Deploy Backend to Cloud Run


    needs: test


    runs-on: ubuntu-latest


    timeout-minutes: 20



    if: |

      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||

      (github.event_name == 'workflow_dispatch' && inputs.deploy == true)



    env:


      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

      REGION: ${{ vars.GCP_REGION }}

      ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}

      CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}

      CLOUD_SQL_INSTANCE: project-f332596d-3e50-409b-914:asia-southeast1:ats-postgres

      DATABASE_URL_SECRET: ${{ vars.GCP_DATABASE_URL_SECRET }}

      IMAGE_NAME: ats-api

      IMAGE_TAG: ${{ github.sha }}



    steps:



      - name: Checkout Repository
        uses: actions/checkout@v4



      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v3

        with:

          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}

          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}



      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3



      - name: Configure Docker Auth
        run: |

          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet



      - name: Build Docker Image
        run: |

          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${IMAGE_TAG}"


          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV



          docker build \
            --platform linux/amd64 \
            -t "${IMAGE_URI}" \
            ./backend



      - name: Push Image
        run: |

          docker push "${IMAGE_URI}"



      - name: Setup Python
        uses: actions/setup-python@v5
        with:

          python-version: "3.13"

          cache: pip

          cache-dependency-path: backend/requirements.txt



      - name: Install Backend Dependencies
        working-directory: backend
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt



      - name: Install Cloud SQL Auth Proxy
        env:

          CLOUD_SQL_PROXY_VERSION: "2.22.0"

        run: |

          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/cloud-sql-proxy" \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v${CLOUD_SQL_PROXY_VERSION}/cloud-sql-proxy.linux.amd64"

          chmod +x "${RUNNER_TEMP}/cloud-sql-proxy"



      - name: Run Production Database Migration
        working-directory: backend
        run: |

          set -euo pipefail

          if [ -z "${DATABASE_URL_SECRET}" ]; then
            echo "GCP_DATABASE_URL_SECRET repository variable is required"
            exit 1
          fi

          "${RUNNER_TEMP}/cloud-sql-proxy" \
            --address 127.0.0.1 \
            --port 5432 \
            "${CLOUD_SQL_INSTANCE}" \
            > "${RUNNER_TEMP}/cloud-sql-proxy.log" 2>&1 &

          PROXY_PID=$!
          trap 'kill "${PROXY_PID}" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null; then
              break
            fi

            if ! kill -0 "${PROXY_PID}" 2>/dev/null; then
              echo "Cloud SQL Auth Proxy stopped before becoming ready"
              exit 1
            fi

            if [ "${attempt}" -eq 30 ]; then
              echo "Cloud SQL Auth Proxy did not become ready"
              exit 1
            fi

            sleep 1
          done

          PRODUCTION_DATABASE_URL="$(gcloud secrets versions access latest \
            --project="${PROJECT_ID}" \
            --secret="${DATABASE_URL_SECRET}")"
          export PRODUCTION_DATABASE_URL

          python - <<'PY'
          import os
          import subprocess

          from sqlalchemy.engine import make_url


          database_url = make_url(os.environ["PRODUCTION_DATABASE_URL"])
          query = dict(database_url.query)
          query.pop("host", None)
          proxy_url = database_url.set(
              host="127.0.0.1",
              port=5432,
              query=query,
          )

          migration_env = os.environ.copy()
          migration_env["DATABASE_URL"] = proxy_url.render_as_string(
              hide_password=False
          )
          migration_env.pop("PRODUCTION_DATABASE_URL", None)

          subprocess.run(
              ["python", "-m", "alembic", "upgrade", "head"],
              check=True,
              env=migration_env,
          )
          subprocess.run(
              ["python", "-m", "alembic", "current"],
              check=True,
              env=migration_env,
          )
          PY

          unset PRODUCTION_DATABASE_URL



      - name: Deploy Cloud Run
        run: |

          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE_URI}" \
            --quiet



      - name: Get Service URL
        run: |

          SERVICE_URL=$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format="value(status.url)")


          echo "SERVICE_URL=${SERVICE_URL}" >> $GITHUB_ENV



      - name: Health Check
        run: |

          for attempt in {1..12}; do


            if curl \
              --fail \
              --silent \
              "${SERVICE_URL}/health/"; then


              echo "Deployment successful"

              exit 0

            fi


            echo "Waiting revision ${attempt}/12"

            sleep 10


          done



          echo "Health check failed"

          exit 1
