name: Frontend CI

on:
  push:
    branches:
      - main
      - feature/**

  pull_request:
    branches:
      - main

jobs:

  frontend-check:

    name: Frontend Lint and Build

    runs-on: ubuntu-24.04

    timeout-minutes: 15

    env:
      NEXT_PUBLIC_API_URL: https://ats-api-355421066989.asia-southeast1.run.app

    defaults:
      run:
        working-directory: frontend


    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      - name: Install Dependencies
        run: npm ci


      - name: Run Lint
        run: npm run lint


      - name: Build Application
        run: npm run build